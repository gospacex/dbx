# Single MySQL configuration for `go run . o` (hardcoded) and `go run . p` (yaml).
# Replace REPLACE_ME with the real password before running.
#
# The 4 sections (mysql / pool / trace / logger) are exhaustive for this example.
# `trace:` uses mqx-standard field names; the example translates them
# to dbx internal config.TracingConfig at startup.

mysql:
  host: 127.0.0.1
  port: 3306
  username: root
  password: rootpass
  database: testdb
  charset: utf8mb4

pool:
  max_open_conns: 50
  max_idle_conns: 10
  conn_max_lifetime: 1800 # seconds
  conn_max_idle_time: 600 # seconds

# Trace config aligned with mqx standard:
#   - section name: trace (NOT tracing)
#   - service_name (NOT service)
#   - protocol: http (mapped internally to http/protobuf)
#   - sampler_type: always_on (mapped internally to parentbased_always_on)
#   - mode: single (mqx standard; drives redisx.POS vs redisx.POC; kafka
#     ignores it because kafkax.POS handles multi-broker via Addrs)
trace:
  # enabled: true
  # service_name: mysql-crud-example
  # exporter: jaeger # one of: jaeger / kafka / redis_stream
  # endpoint: localhost:4318
  # protocol: http
  # sampler_type: always_on
  # sampler_ratio: 1.0
  # mode: single # single (default) | cluster (only meaningful for redis_stream)

  # To switch to kafka, comment out the jaeger block above and uncomment below:
  # enabled: true
  # service_name: mysql-crud-example
  # exporter: kafka
  # endpoint: localhost:9092            # comma-separated for multi-broker cluster
  # topic: otel-traces
  # mode: single                       # kafka ignores mode (kafkax.POS always)
  # kafka_username: ""
  # kafka_password: ""
  # kafka_security_protocol: PLAINTEXT
  # kafka_sasl_mechanism: PLAIN

  # To switch to redis_stream (single node), uncomment below:
  enabled: true
  service_name: mysql-crud-example
  exporter: redis_stream
  endpoint: localhost:6379
  mode: single # → redisx.POS → *redis.Client
  stream: otel-traces
  redis_password: redis123456 # matches e2e/db_e2e_test.go:10

  # To switch to redis_stream (cluster), uncomment below:
  # enabled: true
  # service_name: mysql-crud-example
  # exporter: redis_stream
  # endpoint: 10.0.0.1:6379,10.0.0.2:6379,10.0.0.3:6379
  # mode: cluster                      # → redisx.POC → *redis.ClusterClient
  # stream: otel-traces
  # redis_password: ""

logger:
  level: info # silent | error | warn | info
  color: true # set false or export NO_COLOR=1 to disable ANSI escapes
  slow_threshold_ms: 200 # queries slower than this are flagged in [SQL] output
  ignore_record_not_found: true
